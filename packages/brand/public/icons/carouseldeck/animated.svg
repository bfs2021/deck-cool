<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><style>@keyframes c{0%,20%{transform:translateX(21px) scale(.5,.611);opacity:.5}25%,45%{transform:none;opacity:1}50%,70%{transform:translateX(-21px) scale(.5,.611);opacity:.5}75%{transform:translateX(-40px) scale(.3,.4);opacity:0}76%,95%{transform:translateX(40px) scale(.3,.4);opacity:0}100%{transform:translateX(21px) scale(.5,.611);opacity:.5}}.s{transform-box:fill-box;transform-origin:center;animation:c 7.2s cubic-bezier(.32,.72,0,1) infinite}.s2{animation-delay:-1.8s}.s3{animation-delay:-3.6s}.s4{animation-delay:-5.4s}@media (prefers-reduced-motion: reduce){.s{animation:none}.s1{transform:translateX(21px) scale(.5,.611);opacity:.5}.s3{transform:translateX(-21px) scale(.5,.611);opacity:.5}.s4{opacity:0}}</style><rect width="64" height="64" rx="14.4" fill="#1c1c1e"/><clipPath id="t"><rect width="64" height="64" rx="14.4"/></clipPath><g clip-path="url(#t)"><rect class="s s1" x="20" y="14" width="24" height="36" rx="4" fill="#2997ff"/><rect class="s s2" x="20" y="14" width="24" height="36" rx="4" fill="#2997ff"/><rect class="s s3" x="20" y="14" width="24" height="36" rx="4" fill="#2997ff"/><rect class="s s4" x="20" y="14" width="24" height="36" rx="4" fill="#2997ff"/></g></svg>
