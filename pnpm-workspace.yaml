packages:
  - sites/*
  - packages/*
  # The docs loader's fixture docs package, linked into @deck-cool/docs.
  - packages/docs/fixtures/example-docs
# wrangler deploy runs without esbuild's and workerd's install scripts: the
# Worker has no code to bundle or run, only static assets.
allowBuilds:
  esbuild: false
  workerd: false
# The maintainer published @slidedeck/docs@1.0.3 and @playdeck/docs@1.3.0 by
# hand on 2026-10-11, each from its deck's own main, so these two versions skip
# pnpm's one-day hold (#51, #52). #93 removes these entries once the hold has
# passed.
minimumReleaseAgeExclude:
  - '@slidedeck/docs@1.0.3'
  - '@playdeck/docs@1.3.0'
# satori pins fflate 0.7.3, which GHSA-px8p-9vwx-vf98 covers. Remove this
# override once satori stops pinning 0.7.3.
overrides:
  fflate: 0.7.5
