name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          # The Next.js fixture installs into the same store from its own
          # lockfile (scripts/next-rsc.mjs).
          cache-dependency-path: |
            pnpm-lock.yaml
            tests/next-rsc/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - id: playwright-version
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-firefox-webkit-${{ steps.playwright-version.outputs.version }}
      # chromium without --with-deps: playdeck measured that chromium launches
      # on ubuntu-latest with no apt packages, and apt is what wedged its
      # installs. The e2e suite also runs in Firefox and WebKit, which need
      # their system libraries, so only they bring apt in. Bounded so a
      # stalled download or apt fails instead of hanging.
      - run: pnpm exec playwright install chromium
        timeout-minutes: 10
      - run: pnpm exec playwright install --with-deps firefox webkit
        timeout-minutes: 15
      # The one gate, the same command a developer runs locally.
      - run: pnpm verify
