name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A pull request's newer push cancels its older run. A push to `main` never
# cancels one, for release.yml's reason: `deploy-site` must not stop partway
# through a production deploy. The runs queue instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The gates a change needs, from the paths it changes (scripts/verify.mjs,
  # gatesFor): on a pull request, the paths between its base and the merge
  # commit GitHub checks out, its first parent being the base. A push to
  # `main` runs every gate. Prints `<job>=true|false` for each job below.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      checks: ${{ steps.plan.outputs.checks }}
      unit: ${{ steps.plan.outputs.unit }}
      packages: ${{ steps.plan.outputs.packages }}
      next: ${{ steps.plan.outputs.next }}
      e2e: ${{ steps.plan.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      # Node's built-ins only: no install.
      - id: plan
        shell: bash # with pipefail, so a failing verify.mjs fails the step
        env:
          CHANGED: ${{ github.event_name == 'pull_request' && '--changed=HEAD^1' || '' }}
        run: |
          node scripts/verify.mjs ${CHANGED:+"$CHANGED"} --dry-run
          node scripts/verify.mjs ${CHANGED:+"$CHANGED"} --ci-jobs | tee -a "$GITHUB_OUTPUT"

  # The gates that need no browser. Each gate job runs `pnpm verify --job
  # <its name>`, with `--changed` on a pull request: verify.mjs's CI_JOBS
  # says which steps each job runs, so a gate added there runs here.
  checks:
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - env:
          CHANGED: ${{ github.event_name == 'pull_request' && '--changed=HEAD^1' || '' }}
        run: pnpm verify --job checks ${CHANGED:+"$CHANGED"}

  # The packed tarballs: publint, attw and `'use client'`.
  packages:
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - env:
          CHANGED: ${{ github.event_name == 'pull_request' && '--changed=HEAD^1' || '' }}
        run: pnpm verify --job packages ${CHANGED:+"$CHANGED"}

  # A Next.js server component renders a deck from the packed tarballs.
  next:
    needs: changes
    if: needs.changes.outputs.next == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          # The Next.js fixture installs into the same store from its own
          # lockfile (scripts/next-rsc.mjs).
          cache-dependency-path: |
            pnpm-lock.yaml
            tests/next-rsc/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - env:
          CHANGED: ${{ github.event_name == 'pull_request' && '--changed=HEAD^1' || '' }}
        run: pnpm verify --job next ${CHANGED:+"$CHANGED"}

  # vitest's browser mode: chromium, and webkit for a few tests, in four
  # shards. vitest shards by file, so no one file may be much longer than a
  # shard: arrival.test.tsx, once nine minutes, is four files for that. In
  # Playwright's image, as `e2e` is: its browsers and their
  # system libraries are installed, so no job installs them with apt, which
  # once hung CI for 15 minutes on a slow mirror.
  #
  # The image is pinned by digest, and must match @playwright/test in
  # pnpm-lock.yaml. To bump it with Playwright: change the tag in both jobs,
  # then pin the digest the tag now names, from
  #   docker buildx imagetools inspect mcr.microsoft.com/playwright:v<version>-noble
  # (the index's `Digest:`).
  #
  # It runs as the runner's user, as Playwright's docs advise: Firefox refuses
  # a HOME owned by another user. The image's Node is 24; setup-node puts
  # Node 22 first on PATH, as every other job uses. Corepack's shims go to a
  # directory that user can write, not the image's /usr/bin.
  unit:
    needs: changes
    if: needs.changes.outputs.unit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - run: |
          mkdir -p "$RUNNER_TEMP/corepack"
          corepack enable --install-directory "$RUNNER_TEMP/corepack"
          echo "$RUNNER_TEMP/corepack" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - env:
          CHANGED: ${{ github.event_name == 'pull_request' && '--changed=HEAD^1' || '' }}
          SHARD: ${{ matrix.shard }}
        run: pnpm verify --job unit --shard="$SHARD" ${CHANGED:+"$CHANGED"}

  # The e2e suite, one Playwright project per job, in the image `unit` uses:
  # keep the two in step.
  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - run: |
          mkdir -p "$RUNNER_TEMP/corepack"
          corepack enable --install-directory "$RUNNER_TEMP/corepack"
          echo "$RUNNER_TEMP/corepack" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - env:
          CHANGED: ${{ github.event_name == 'pull_request' && '--changed=HEAD^1' || '' }}
          PROJECT: ${{ matrix.project }}
        run: pnpm verify --job e2e --project="$PROJECT" ${CHANGED:+"$CHANGED"}

  # The one check to require in branch protection: it passes when every gate
  # job passed, or was skipped because the change needs none of its gates.
  all-gates:
    needs: [changes, checks, packages, next, unit, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Gate jobs: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "::error::A gate job ended in $result."
                exit 1
                ;;
            esac
          done

  # Uploads the site to Cloudflare Pages (project `slidedeck`): production from
  # a push to `main`, a preview at https://pr-<number>.slidedeck.pages.dev from
  # a pull request. A job here rather than its own workflow, so it runs only
  # after every gate job passed on the same commit, or was skipped as the
  # change needs none of its gates, with no second verify.
  # See AGENTS.md, "Site".
  #
  # It builds the site itself, as release.yml's jobs whose output ships do: no
  # pnpm store cache and no turbo cache, as a restored cache is code from
  # another run.
  #
  # A fork, and a pull request from one, get no secrets: the job is skipped,
  # which passes, rather than run and fail.
  deploy-site:
    needs: [checks, packages, next, unit, e2e, all-gates]
    if: >-
      !cancelled() && needs.all-gates.result == 'success' &&
      github.repository == 'pedrosousa13/slidedeck' &&
      (github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # the preview comment
    # Every action is pinned to a full commit SHA, its version in a comment:
    # this job holds the Cloudflare token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fails before anything is built or uploaded when a secret is missing,
      # and says which, rather than leaving it to wrangler's error.
      - name: Check the Cloudflare secrets are set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Nothing was deployed. See AGENTS.md, Site."
            exit 1
          fi

      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      # The token is only in the deploy step's environment, never in these.
      - run: pnpm install --frozen-lockfile
      # The site and the packages it depends on. `--force`: no cache, local or
      # remote, even if one is ever configured.
      - run: pnpm exec turbo run build --filter=@slidedeck/site --force

      # `main` is the Pages project's production branch; any other is a preview.
      - name: Deploy to Cloudflare Pages
        working-directory: apps/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
          BRANCH: ${{ github.event_name == 'push' && 'main' || format('pr-{0}', github.event.pull_request.number) }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pnpm exec wrangler pages deploy site --project-name slidedeck --branch "$BRANCH" --commit-hash "$COMMIT"

      # Prints the URLs and, on a pull request, writes them into its one
      # preview comment.
      - name: Report the deployment
        env:
          GH_TOKEN: ${{ github.token }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/site-preview.mjs
