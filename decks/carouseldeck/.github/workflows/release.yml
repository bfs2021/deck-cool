name: Release

# Changesets' version-PR flow (#39). On every push to `main`, `verify` runs the
# same `pnpm verify` as `ci.yml`, then asks Changesets what the tree is:
#
# - changesets pending: `version` opens or updates the "Version packages" PR.
#   Nothing is published.
# - no changesets, and a version not yet on npm (the version PR just merged):
#   `publish` publishes the tarballs `verify` packed, with provenance, then
#   `tag` tags them and creates their GitHub releases.
# - neither: nothing runs after `verify`.
#
# Nothing after `verify` runs until the maintainer sets the `RELEASE_ENABLED`
# repository variable to `true`, the last step of the one-time setup in
# AGENTS.md ("Releasing"). Until then the jobs show as skipped.
#
# Two departures from playdeck's release.yml, which ADR-0002 otherwise copies:
#
# - A push trigger, not `workflow_dispatch` with a dry run. Playdeck bumped
#   its first version by hand; here Changesets decides, and the deliberate act
#   is merging the "Version packages" PR, so there is nothing left to dispatch.
# - The workflow tags the versions, in `tag`, after `publish`. Playdeck pushes
#   tags from `main` by hand so its credential job never holds
#   `contents: write`; `tag` keeps that separation, and tags whatever is on
#   npm but untagged. `tag` runs only after `publish` succeeds, so a missed
#   tag is recovered by re-running the `tag` job, or by the next run that
#   publishes a release.
#
# npm can answer 404 for a version for minutes after publishing it (#63: the
# 0.1.0 run tagged nothing). So `tag` waits, for the versions `publish` names
# in its `published-packages` output only: it polls npm with backoff for up to
# ten minutes, tags each as soon as npm shows it, and fails, naming them, if
# any is still missing at the end. A 429, a 5xx or a timeout from npm meanwhile
# counts as "not yet". A version not published in this run is checked once,
# as before. `scripts/tag-releases.mjs` does it.
on:
  push:
    branches: [main]

# Read-only, as in `ci.yml`. Each job widens its own copy only as far as it
# needs. The publish credential (`id-token: write`, `NPM_TOKEN`) is only in
# `publish`, which never runs the repo's code and cannot write to the repo.
permissions:
  contents: read

# Copied from playdeck's release.yml: not `cancel-in-progress`, unlike
# `ci.yml`. Half the packages on the registry and half not is worse than a
# queued second run.
concurrency:
  group: release
  cancel-in-progress: false

# Every action is pinned to a full commit SHA, its version in a comment: they
# are on the publish path. `ci.yml` pins by tag.
jobs:
  verify:
    # A fork gets its own copy of this file. Refuse outright rather than build
    # and pack under this repo's package names (playdeck does the same).
    if: github.repository == 'pedrosousa13/slidedeck'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - if: vars.RELEASE_ENABLED != 'true'
        run: echo "::notice::Releases are off until the RELEASE_ENABLED repository variable is true. See AGENTS.md, Releasing."

      # From here to `pnpm verify`, the steps of `ci.yml`: keep them in step.
      # One difference: no pnpm store cache. This job packs the tarballs that
      # ship, and a restored store is code from another run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - id: playwright-version
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"
      # The browser cache stays: the browsers drive the tests and never go
      # into a tarball. It also stays unlike playdeck's release.yml, because
      # this runs on every push to `main`, not a few times a year.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-firefox-webkit-${{ steps.playwright-version.outputs.version }}
      - run: pnpm exec playwright install chromium
        timeout-minutes: 10
      - run: pnpm exec playwright install --with-deps firefox webkit
        timeout-minutes: 15
      - run: pnpm verify

      # "version", "publish" or "none". Reads `.changeset/` and, when no
      # changeset is pending, asks npm which versions it lacks.
      - id: select-mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

      # Packs the build `pnpm verify` just checked, so what `publish` ships is
      # what this job verified, and `publish` builds nothing itself.
      - id: pack
        if: vars.RELEASE_ENABLED == 'true' && steps.select-mode.outputs.mode == 'publish'
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}

  version:
    needs: verify
    if: vars.RELEASE_ENABLED == 'true' && needs.verify.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the changeset-release/main branch
      pull-requests: write # open or update the "Version packages" PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      # No cache in the jobs that can write, as Changesets recommends: a
      # restored cache is code from another run.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      # For the Changesets CLI only. `--ignore-scripts`: no dependency's
      # lifecycle script runs in a job that can write to the repo.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Runs `changeset version`. A PR this job opens with the default token
      # does not trigger `ci.yml`; the push its merge makes runs `verify` above
      # before anything is published.
      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  publish:
    needs: verify
    if: vars.RELEASE_ENABLED == 'true' && needs.verify.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Trusted publishing, and provenance: without it npm refuses a publish
      # whose manifest sets `publishConfig.provenance`.
      id-token: write
    # What this run published, for `tag` to wait for.
    outputs:
      published-packages: ${{ steps.publish.outputs.published-packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      # No `registry-url`, deliberately, as in playdeck: it writes an `.npmrc`
      # holding `${NODE_AUTH_TOKEN}`, which `pnpm publish` can send unresolved
      # as a bearer token and fail a publish OIDC would have carried.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      # For the Changesets CLI only: this job builds nothing, and
      # `--ignore-scripts` keeps every dependency's lifecycle script out of the
      # job that holds the credential. The lockfile pins what is installed.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10. `pnpm
      # publish` spawns the `npm` on PATH, so this is the npm that publishes.
      # Pinned, as in playdeck: this step is on the credential path.
      - run: npm install -g npm@11.19.0
      - run: npm --version

      # Fails before anything reaches npm when no credential can publish, and
      # says why, rather than leaving it to npm's error on the first package.
      - name: Check a credential can publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$REPO_PRIVATE" = "true" ]; then
            echo "::error::The repository is private. npm generates provenance only from a public repository, and these packages require it. See AGENTS.md, Releasing."
            exit 1
          fi
          if [ -n "$NPM_TOKEN" ]; then
            echo "Publishing with the NPM_TOKEN secret, unless a trusted publisher answers first."
            exit 0
          fi
          # Trusted publishing is configured on a package that already exists,
          # so with no token every package must be on the registry already.
          missing=""
          for manifest in packages/*/package.json; do
            name=$(node -p "require('./$manifest').name")
            npm view "$name" name > /dev/null 2>&1 || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::No credential can publish:$missing not on npm, and no NPM_TOKEN secret is set. Nothing was published. See AGENTS.md, Releasing."
            exit 1
          fi
          echo "Publishing over trusted publishing (OIDC)."

      # Only when the secret exists: an unresolved placeholder must not reach
      # `pnpm publish`, for the reason given at `setup-node` above.
      - name: Use the NPM_TOKEN secret, if set
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' >> ~/.npmrc
          fi

      # `changeset publish --from-pack-dir`: publishes core before react, as
      # react depends on it, and stops at the first failure, so react is never
      # published without core. Provenance comes from each manifest's
      # `publishConfig.provenance`. Tags and releases are `tag`'s, so this job
      # needs no `contents: write`.
      - id: publish
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        with:
          pack-dir-artifact-id: ${{ needs.verify.outputs.pack-dir-artifact-id }}
          push-git-tags: false
          create-github-releases: false

  tag:
    needs: publish
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Up to ten minutes waiting for npm, and the tagging around it.
    timeout-minutes: 20
    permissions:
      contents: write # create the tags and the GitHub releases
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No install: the script, from the commit `verify` checked, uses Node's
      # built-ins only and reads the manifests and changelogs as data. It
      # reads npm anonymously; this job holds no npm credential. Every package
      # version on npm without a release gets one, tagged `<name>@<version>`
      # at this commit, as Changesets tags, with its changelog section as the
      # notes.
      - name: Tag and release what npm has
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_PACKAGES: ${{ needs.publish.outputs.published-packages }}
        run: node scripts/tag-releases.mjs
