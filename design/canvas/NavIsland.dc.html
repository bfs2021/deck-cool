<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Top bar A: Island</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#000}
a{color:#2997ff}a:hover{color:#5eb0ff}
.cap{transition: width .45s cubic-bezier(.32,.72,0,1), height .45s cubic-bezier(.32,.72,0,1), top .45s cubic-bezier(.32,.72,0,1), box-shadow .45s cubic-bezier(.32,.72,0,1)}
.layer{transition: opacity .22s ease, transform .45s cubic-bezier(.32,.72,0,1)}
.navlink{transition: color .2s ease}
.navlink:hover{color:#f5f5f7}
.bar{transition: width .12s linear}
@media (prefers-reduced-motion: reduce){.cap,.layer{transition: opacity .2s ease}}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 680px; overflow: hidden; background: #000000; color: #f5f5f7; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', sans-serif; -webkit-font-smoothing: antialiased;">

  <div onScroll="{{ onScroll }}" style="position: absolute; inset: 0; overflow-y: auto;">
    <section style="height: 560px; box-sizing: border-box; padding: 150px 22px 0; text-align: center; background: #000000;">
      <div style="font-size: 21px; font-weight: 600; color: {{accentText}};">{{eyebrow}}</div>
      <h1 style="margin: 12px auto 0; max-width: 820px; font-size: 80px; line-height: 1.05; font-weight: 600; letter-spacing: -0.025em;">{{headline}}</h1>
      <p style="margin: 20px auto 0; max-width: 600px; font-size: 21px; line-height: 1.38; color: #a1a1a6;">{{sub}}</p>
    </section>
    <sc-for list="{{ sections }}" as="s" hint-placeholder-count="4">
      <section style="height: 420px; box-sizing: border-box; padding: 96px 22px; border-top: 1px solid #1d1d1f;">
        <div style="max-width: 980px; margin: 0 auto;">
          <div style="font-size: 17px; font-weight: 600; color: {{accentText}};">{{ s.label }}</div>
          <h2 style="margin: 8px 0 0; font-size: 48px; line-height: 1.08; font-weight: 600; letter-spacing: -0.02em;">{{ s.title }}</h2>
        </div>
      </section>
    </sc-for>
  </div>

  <nav aria-label="Main" class="cap" onMouseEnter="{{ enter }}" onMouseLeave="{{ leave }}" style="position: absolute; left: 50%; transform: translateX(-50%); top: {{capTop}}px; width: {{capW}}px; height: {{capH}}px; border-radius: 999px; background: rgba(22,22,23,0.8); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border: 1px solid rgba(255,255,255,0.1); box-shadow: {{capShadow}}; overflow: hidden;">

    <div class="layer" style="position: absolute; inset: 0; display: flex; align-items: center; gap: 28px; padding: 0 8px 0 18px; opacity: {{fullOpacity}}; transform: scale({{fullScale}}); pointer-events: {{fullEvents}};">
      <a href="#" style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: #f5f5f7; font-size: 15px; font-weight: 600; letter-spacing: -0.01em;">
        <sc-if value="{{ isSlide }}" hint-placeholder-val="{{ true }}"><svg width="22" height="22" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14.4" fill="#0071e3"></rect><rect x="12" y="18" width="30" height="28" rx="5" fill="#fff"></rect><rect x="46" y="22" width="8" height="20" rx="3" fill="#fff" opacity="0.55"></rect></svg></sc-if>
        <sc-if value="{{ isPlay }}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14.4" fill="#d9214f"></rect><rect x="12" y="16" width="40" height="32" rx="7" fill="#fff"></rect><path d="M28 25 L39 32 L28 39 Z" fill="#d9214f"></path></svg></sc-if>
        <sc-if value="{{ isPage }}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14.4" fill="#0a7a50"></rect><path d="M18 12 H38 L48 22 V52 H18 Z" fill="#fff"></path><path d="M38 12 V22 H48" fill="none" stroke="#0a7a50" stroke-width="3" stroke-linejoin="round"></path></svg></sc-if>
        {{name}}
      </a>
      <div style="display: flex; gap: 22px; font-size: 13px;">
        <a class="navlink" href="#" style="color: #a1a1a6; text-decoration: none;">Docs</a>
        <a class="navlink" href="#" style="color: #a1a1a6; text-decoration: none;">Examples</a>
        <a class="navlink" href="#" style="color: #a1a1a6; text-decoration: none;">Changelog</a>
        <a class="navlink" href="#" style="color: #a1a1a6; text-decoration: none;">GitHub</a>
      </div>
      <a href="#" style="margin-left: auto; padding: 7px 14px; border-radius: 999px; background: {{accent}}; color: #fff; font-size: 13px; text-decoration: none;">Install</a>
    </div>

    <div class="layer" style="position: absolute; inset: 0; display: flex; align-items: center; gap: 10px; padding: 0 6px 0 12px; opacity: {{miniOpacity}}; transform: scale({{miniScale}}); pointer-events: {{miniEvents}};">
      <sc-if value="{{ isSlide }}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14.4" fill="#0071e3"></rect><rect x="12" y="18" width="30" height="28" rx="5" fill="#fff"></rect><rect x="46" y="22" width="8" height="20" rx="3" fill="#fff" opacity="0.55"></rect></svg></sc-if>
      <sc-if value="{{ isPlay }}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14.4" fill="#d9214f"></rect><rect x="12" y="16" width="40" height="32" rx="7" fill="#fff"></rect><path d="M28 25 L39 32 L28 39 Z" fill="#d9214f"></path></svg></sc-if>
      <sc-if value="{{ isPage }}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14.4" fill="#0a7a50"></rect><path d="M18 12 H38 L48 22 V52 H18 Z" fill="#fff"></path><path d="M38 12 V22 H48" fill="none" stroke="#0a7a50" stroke-width="3" stroke-linejoin="round"></path></svg></sc-if>
      <span style="font-size: 13px; font-weight: 600;">{{current}}</span>
      <button type="button" aria-label="Open menu" style="margin-left: auto; width: 32px; height: 32px; border-radius: 999px; border: 0; background: #2c2c2e; display: flex; align-items: center; justify-content: center; cursor: pointer;">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 5h10M2 9h10" stroke="#f5f5f7" stroke-width="1.5" stroke-linecap="round"></path></svg>
      </button>
    </div>

    <div class="bar" style="position: absolute; left: 0; bottom: 0; height: 2px; width: {{progress}}%; background: {{accent}}; opacity: {{miniOpacity}};"></div>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"product":{"editor":"enum","options":["slidedeck","playdeck","pagedeck"],"default":"slidedeck"},"$preview":{"width":1280,"height":680}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { top: 0, prog: 0, hover: false };
  }
  renderVals() {
    const P = {
      slidedeck: { accent: '#0071e3', accentText: '#2997ff', eyebrow: 'slidedeck 1.0', headline: 'Smooth. Natively.', sub: 'A carousel for React that lets the browser do the scrolling.',
        sections: [['Native scroll snap', 'The browser scrolls. slidedeck keeps count.'], ['Loop', 'Past the last slide, back to the first.'], ['Fade', 'A crossfade that still scrolls.'], ['Curve', 'Slides on an arc.'], ['Accessibility', 'Accessible from the first render.']] },
      playdeck: { accent: '#d9214f', accentText: '#ff5c86', eyebrow: 'playdeck', headline: 'A video player you compose.', sub: 'React primitives and hooks over native video, HLS, YouTube, Vimeo and Wistia.',
        sections: [['Compose it', 'Every control is a component.'], ['Style it', 'No CSS ships in the bundle.'], ['Providers', 'Ask what the provider can do.'], ['Autoplay', 'Recover from refused autoplay.']] },
      pagedeck: { accent: '#0a7a50', accentText: '#3ddc97', eyebrow: 'pagedeck 0.2', headline: 'Zero JavaScript until a page needs it.', sub: 'A React framework for CMS-driven sites. Each page ships only what it uses.',
        sections: [['Same React', 'No floor.'], ['Islands', 'An island taxes only itself.'], ['Budgets', 'One byte more fails the build.'], ['Deploy', 'Upload only the files that changed.']] }
    };
    const name = this.props.product ?? 'slidedeck';
    const p = P[name] || P.slidedeck;
    const compact = this.state.top > 80 && !this.state.hover;
    const idx = Math.max(0, Math.min(p.sections.length - 1, Math.floor((this.state.top + 120 - 560) / 420)));
    const current = this.state.top < 440 ? 'Overview' : p.sections[idx][0];
    return {
      name, accent: p.accent, accentText: p.accentText, eyebrow: p.eyebrow, headline: p.headline, sub: p.sub,
      isSlide: name === 'slidedeck', isPlay: name === 'playdeck', isPage: name === 'pagedeck',
      sections: p.sections.map(([label, title]) => ({ label, title })),
      current,
      capW: compact ? 248 : 760,
      capH: compact ? 44 : 52,
      capTop: compact ? 12 : 14,
      capShadow: compact ? '0 8px 30px rgba(0,0,0,0.6)' : '0 0 0 rgba(0,0,0,0)',
      fullOpacity: compact ? 0 : 1, fullScale: compact ? 0.96 : 1, fullEvents: compact ? 'none' : 'auto',
      miniOpacity: compact ? 1 : 0, miniScale: compact ? 1 : 1.04, miniEvents: compact ? 'auto' : 'none',
      progress: Math.round(this.state.prog * 100),
      onScroll: (e) => {
        const el = e.currentTarget;
        const max = Math.max(1, el.scrollHeight - el.clientHeight);
        this.setState({ top: el.scrollTop, prog: el.scrollTop / max });
      },
      enter: () => this.setState({ hover: true }),
      leave: () => this.setState({ hover: false })
    };
  }
}
</script>
</body>
</html>
