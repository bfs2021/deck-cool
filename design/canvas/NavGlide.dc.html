<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Top bar B: Glide</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#000}
a{color:#2997ff}a:hover{color:#5eb0ff}
.pill{transition: left .38s cubic-bezier(.32,.72,0,1), width .38s cubic-bezier(.32,.72,0,1), opacity .2s ease}
.panel{transition: height .45s cubic-bezier(.32,.72,0,1)}
.menu{transition: opacity .2s ease, transform .45s cubic-bezier(.32,.72,0,1)}
.item{transition: opacity .3s ease, transform .45s cubic-bezier(.32,.72,0,1)}
.dim{transition: opacity .3s ease}
.glink{transition: color .2s ease}
.mlink{color:#f5f5f7;text-decoration:none}
.mlink:hover{color:#2997ff}
@media (prefers-reduced-motion: reduce){.pill,.panel,.menu,.item{transition: opacity .2s ease}}
</style>
</helmet>
<div onMouseLeave="{{ leaveAll }}" style="position: relative; width: 1280px; height: 680px; overflow: hidden; background: #000000; color: #f5f5f7; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', sans-serif; -webkit-font-smoothing: antialiased;">

  <section style="position: absolute; inset: 0; box-sizing: border-box; padding: 150px 22px 0; text-align: center; background: #000000;">
    <div style="font-size: 21px; font-weight: 600; color: {{accentText}};">{{eyebrow}}</div>
    <h1 style="margin: 12px auto 0; max-width: 820px; font-size: 80px; line-height: 1.05; font-weight: 600; letter-spacing: -0.025em;">{{headline}}</h1>
    <p style="margin: 20px auto 0; max-width: 600px; font-size: 21px; line-height: 1.38; color: #a1a1a6;">{{sub}}</p>
  </section>

  <div class="dim" style="position: absolute; inset: 52px 0 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); opacity: {{dimOpacity}}; pointer-events: none;"></div>

  <div class="panel" style="position: absolute; left: 0; right: 0; top: 0; height: {{panelH}}px; background: rgba(22,22,23,0.94); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid rgba(255,255,255,0.08); overflow: hidden;">
    <sc-for list="{{ menus }}" as="m" hint-placeholder-count="3">
      <div class="menu" style="position: absolute; top: 52px; left: 0; right: 0; opacity: {{ m.opacity }}; transform: translateY({{ m.shift }}px); pointer-events: {{ m.events }};">
        <div style="max-width: 980px; margin: 0 auto; padding: 32px 22px 40px; display: flex; gap: 72px;">
          <sc-for list="{{ m.cols }}" as="c" hint-placeholder-count="2">
            <div style="display: flex; flex-direction: column; gap: 10px;">
              <div class="item" style="font-size: 12px; color: #a1a1a6; opacity: {{ c.opacity }}; transform: translateY({{ c.shift }}px); transition-delay: {{ c.delay }}ms;">{{ c.title }}</div>
              <sc-for list="{{ c.items }}" as="it" hint-placeholder-count="3">
                <a class="item mlink" href="#" style="font-size: {{ c.size }}px; font-weight: 600; letter-spacing: -0.01em; opacity: {{ it.opacity }}; transform: translateY({{ it.shift }}px); transition-delay: {{ it.delay }}ms;">{{ it.label }}</a>
              </sc-for>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; top: 0; height: 52px; background: {{barBg}}; backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid {{barRule}};">
    <div style="max-width: 980px; height: 52px; margin: 0 auto; padding: 0 22px; display: flex; align-items: center;">
      <a href="#" onMouseEnter="{{ leaveLinks }}" style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: #f5f5f7; font-size: 15px; font-weight: 600; letter-spacing: -0.01em;">
        <sc-if value="{{ isSlide }}" hint-placeholder-val="{{ true }}"><svg width="22" height="22" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14.4" fill="#0071e3"></rect><rect x="12" y="18" width="30" height="28" rx="5" fill="#fff"></rect><rect x="46" y="22" width="8" height="20" rx="3" fill="#fff" opacity="0.55"></rect></svg></sc-if>
        <sc-if value="{{ isPlay }}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14.4" fill="#d9214f"></rect><rect x="12" y="16" width="40" height="32" rx="7" fill="#fff"></rect><path d="M28 25 L39 32 L28 39 Z" fill="#d9214f"></path></svg></sc-if>
        <sc-if value="{{ isPage }}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14.4" fill="#0a7a50"></rect><path d="M18 12 H38 L48 22 V52 H18 Z" fill="#fff"></path><path d="M38 12 V22 H48" fill="none" stroke="#0a7a50" stroke-width="3" stroke-linejoin="round"></path></svg></sc-if>
        {{name}}
      </a>
      <div style="position: relative; margin-left: auto; display: flex; height: 32px;">
        <div class="pill" style="position: absolute; top: 0; height: 32px; left: {{pillX}}px; width: {{pillW}}px; border-radius: 999px; background: rgba(255,255,255,0.12); opacity: {{pillOpacity}};"></div>
        <sc-for list="{{ links }}" as="l" hint-placeholder-count="5">
          <a class="glink" href="#" onMouseEnter="{{ l.enter }}" onClick="{{ l.pick }}" aria-current="{{ l.current }}" style="position: relative; width: {{ l.w }}px; height: 32px; display: flex; align-items: center; justify-content: center; font-size: 13px; text-decoration: none; color: {{ l.color }}; font-weight: {{ l.weight }};">{{ l.label }}</a>
        </sc-for>
      </div>
      <a href="#" onMouseEnter="{{ leaveLinks }}" style="margin-left: 16px; padding: 7px 14px; border-radius: 999px; background: {{accent}}; color: #fff; font-size: 13px; text-decoration: none;">Install</a>
    </div>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"product":{"editor":"enum","options":["slidedeck","playdeck","pagedeck"],"default":"slidedeck"},"$preview":{"width":1280,"height":680}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { hover: -1, active: 0 };
  }
  renderVals() {
    const P = {
      slidedeck: { accent: '#0071e3', accentText: '#2997ff', eyebrow: 'slidedeck 1.0', headline: 'Smooth. Natively.', sub: 'A carousel for React that lets the browser do the scrolling.' },
      playdeck: { accent: '#d9214f', accentText: '#ff5c86', eyebrow: 'playdeck', headline: 'A video player you compose.', sub: 'React primitives and hooks over native video, HLS, YouTube, Vimeo and Wistia.' },
      pagedeck: { accent: '#0a7a50', accentText: '#3ddc97', eyebrow: 'pagedeck 0.2', headline: 'Zero JavaScript until a page needs it.', sub: 'A React framework for CMS-driven sites. Each page ships only what it uses.' }
    };
    const name = this.props.product ?? 'slidedeck';
    const p = P[name] || P.slidedeck;
    const LINKS = [
      { label: 'Docs', w: 64, menu: { h: 248, cols: [['Get started', 24, ['Install', 'Your first deck', 'Server components']], ['Reference', 14, ['Deck', 'Slide', 'Controls', 'Hooks']]] } },
      { label: 'Examples', w: 88, menu: { h: 208, cols: [['Patterns', 24, ['Product row', 'Hero', 'Gallery']]] } },
      { label: 'Effects', w: 76, menu: { h: 208, cols: [['Import on demand', 24, ['Fade', 'Curve', 'Autoplay']]] } },
      { label: 'Changelog', w: 92 },
      { label: 'GitHub', w: 72 }
    ];
    const hover = this.state.hover;
    const active = this.state.active;
    const target = hover >= 0 ? hover : active;
    let x = 0; const xs = LINKS.map((l) => { const at = x; x += l.w; return at; });
    const open = hover >= 0 && !!LINKS[hover].menu;
    const menus = LINKS.filter((l) => l.menu).map((l) => {
      const i = LINKS.indexOf(l);
      const on = open && hover === i;
      let n = 0;
      return {
        opacity: on ? 1 : 0, shift: on ? 0 : -8, events: on ? 'auto' : 'none',
        cols: l.menu.cols.map(([title, size, items]) => {
          const titleDelay = (n++) * 30;
          return {
            title, size, delay: on ? titleDelay : 0, opacity: on ? 1 : 0, shift: on ? 0 : -6,
            items: items.map((label) => { const d = (n++) * 30; return { label, delay: on ? d : 0, opacity: on ? 1 : 0, shift: on ? 0 : -6 }; })
          };
        })
      };
    });
    return {
      name, accent: p.accent, accentText: p.accentText, eyebrow: p.eyebrow, headline: p.headline, sub: p.sub,
      isSlide: name === 'slidedeck', isPlay: name === 'playdeck', isPage: name === 'pagedeck',
      pillX: xs[target], pillW: LINKS[target].w, pillOpacity: 1,
      panelH: open ? LINKS[hover].menu.h : 52,
      dimOpacity: open ? 1 : 0,
      barBg: open ? 'rgba(22,22,23,0)' : 'rgba(22,22,23,0.8)',
      barRule: open ? 'rgba(0,0,0,0)' : 'rgba(255,255,255,0.08)',
      menus,
      links: LINKS.map((l, i) => ({
        label: l.label, w: l.w,
        color: i === target ? '#f5f5f7' : '#a1a1a6',
        weight: i === active ? 600 : 400,
        current: i === active ? 'page' : 'false',
        enter: () => this.setState({ hover: i }),
        pick: (e) => { e.preventDefault(); this.setState({ active: i }); }
      })),
      leaveLinks: () => this.setState({ hover: -1 }),
      leaveAll: () => this.setState({ hover: -1 })
    };
  }
}
</script>
</body>
</html>
